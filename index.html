<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IngeRedSoft - Catálogo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos originales preservados + visor de zoom integrado */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .product-img {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .product-img:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Encabezado con tu estilo azul original -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">IngeRedSoft | Catálogo</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Tecnología y Redes</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h2 class="text-xl font-semibold text-gray-700">Nuestros Productos y Servicios</h2>
            <!-- Buscador -->
            <input type="text" id="searchInput" placeholder="Buscar producto..." class="px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm w-full md:w-64" oninput="filtrarProductos()">
        </div>

        <!-- Grid de Productos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los productos se cargan dinámicamente -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t mt-12 py-6 text-center text-sm text-gray-500">
        <p>© 2026 IngeRedSoft. Todos los derechos reservados.</p>
        <p class="mt-2">
            <button onclick="verificarAdmin()" class="text-blue-600 hover:underline font-medium">Acceso Administrativo</button>
        </p>
    </footer>

    <!-- Panel de Administración (Modal Oculto) -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Panel de Administración</h3>
            
            <form id="productForm" onsubmit="guardarProducto(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
                    <input type="text" id="prodNombre" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Precio</label>
                    <input type="text" id="prodPrecio" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Categoría</label>
                    <input type="text" id="prodCategoria" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Enlace de la Imagen (URL)</label>
                    <input type="url" id="prodImagen" required placeholder="https://..." class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Descripción</label>
                    <textarea id="prodDescripcion" rows="3" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="cerrarAdmin()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Guardar Producto</button>
                </div>
            </form>

            <hr class="my-6">

            <h4 class="font-bold text-gray-700 mb-2">Productos Registrados</h4>
            <div id="adminProductList" class="space-y-2 max-h-40 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Visor de Zoom en Grande (Modal para Imágenes) -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal()">
        <span class="image-modal-close">&times;</span>
        <img id="modalImage" src="" alt="Imagen Ampliada">
    </div>

    <!-- Lógica en JavaScript -->
    <script>
        const productosIniciales = [
            {
                nombre: "VENTILADOR",
                precio: "$45.000",
                categoria: "Hogar",
                imagen: "https://images.unsplash.com/photo-1584269600464-37b1b58a9fe7?w=500&auto=format&fit=crop&q=60",
                descripcion: "Aire fresco 3 velocidades + base soporte"
            },
            {
                nombre: "Xiaomi Mi Electric Scooter",
                precio: "$1.850.000",
                categoria: "Patinetas",
                imagen: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=500&auto=format&fit=crop&q=60",
                descripcion: "¡Ultraligera y súper práctica! Peso pluma."
            },
            {
                nombre: "JBL PARTYBOX ENCORE",
                precio: "$1.200.000",
                categoria: "Audio",
                imagen: "https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500&auto=format&fit=crop&q=60",
                descripcion: "Potencia de salida: 100, Respuesta de frecuencia"
            }
        ];

        function obtenerProductos() {
            let guardados = localStorage.getItem('ingeredsoft_productos');
            if (!guardados) {
                localStorage.setItem('ingeredsoft_productos', JSON.stringify(productosIniciales));
                return productosIniciales;
            }
            return JSON.parse(guardados);
        }

        function guardarEnStorage(productos) {
            localStorage.setItem('ingeredsoft_productos', JSON.stringify(productos));
        }

        function renderizarCatalogo(lista = null) {
            const grid = document.getElementById('productGrid');
            const productos = lista || obtenerProductos();
            grid.innerHTML = '';

            if (productos.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">No hay productos disponibles.</p>';
                return;
            }

            productos.forEach((p) => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border border-gray-100 hover:shadow-lg transition-shadow">
                        <div>
                            <img src="${p.imagen}" alt="${p.nombre}" class="product-img w-full h-48 object-cover" onclick="openImageModal('${p.imagen}')" title="Haz clic para ver en grande">
                            <div class="p-4">
                                <span class="text-xs bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-semibold">${p.categoria}</span>
                                <h3 class="font-bold text-lg text-gray-800 mt-2">${p.nombre}</h3>
                                <p class="text-blue-600 font-bold text-md mt-1">${p.precio}</p>
                                <p class="text-gray-600 text-sm mt-2">${p.descripcion}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarProductos() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const productos = obtenerProductos();
            const filtrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(texto) || 
                p.categoria.toLowerCase().includes(texto) ||
                p.descripcion.toLowerCase().includes(texto)
            );
            renderizarCatalogo(filtrados);
        }

        function verificarAdmin() {
            const password = prompt("Ingrese la contraseña de administrador:");
            if (password === "IngeRed2026") {
                abrirAdmin();
            } else if (password !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function abrirAdmin() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminModal').classList.add('flex');
            renderizarListaAdmin();
        }

        function cerrarAdmin() {
            document.getElementById('adminModal').classList.remove('flex');
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('productForm').reset();
            document.getElementById('editIndex').value = '';
            renderizarCatalogo();
        }

        function guardarProducto(e) {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const nuevoProd = {
                nombre: document.getElementById('prodNombre').value,
                precio: document.getElementById('prodPrecio').value,
                categoria: document.getElementById('prodCategoria').value,
                imagen: document.getElementById('prodImagen').value,
                descripcion: document.getElementById('prodDescripcion').value
            };

            let productos = obtenerProductos();
            if (index === "") {
                productos.push(nuevoProd);
            } else {
                productos[index] = nuevoProd;
            }

            guardarEnStorage(productos);
            document.getElementById('productForm').reset();
            document.getElementById('editIndex').value = '';
            renderizarListaAdmin();
            renderizarCatalogo();
            alert("¡Operación exitosa!");
        }

        function renderizarListaAdmin() {
            const listaDiv = document.getElementById('adminProductList');
            const productos = obtenerProductos();
            listaDiv.innerHTML = '';

            productos.forEach((p, index) => {
                listaDiv.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-sm">
                        <span class="truncate w-40 font-medium">${p.nombre}</span>
                        <div class="space-x-2">
                            <button type="button" onclick="cargarParaEditar(${index})" class="text-blue-600 hover:underline">Editar</button>
                            <button type="button" onclick="eliminarProducto(${index})" class="text-red-600 hover:underline">Eliminar</button>
                        </div>
                    </div>
                `;
            });
        }

        function cargarParaEditar(index) {
            const productos = obtenerProductos();
            const p = productos[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('prodNombre').value = p.nombre;
            document.getElementById('prodPrecio').value = p.precio;
            document.getElementById('prodCategoria').value = p.categoria;
            document.getElementById('prodImagen').value = p.imagen;
            document.getElementById('prodDescripcion').value = p.descripcion;
        }

        function eliminarProducto(index) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                let productos = obtenerProductos();
                productos.splice(index, 1);
                guardarEnStorage(productos);
                renderizarListaAdmin();
                renderizarCatalogo();
            }
        }

        // Funciones del visor de zoom
        function openImageModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'flex';
            modalImg.src = imgSrc;
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        window.onload = function() {
            renderizarCatalogo();
        };
    </script>
</body>
</html>
